<!DOCTYPE html>
<html>
<head>
  <title>Cadastro de Usuários</title>
</head>
<body>
  <h1>Cadastro de Usuários</h1>

  <!-- Formulário de cadastro -->
  <form id="userForm">
    <label>Nome:</label>
    <input type="text" id="name" required><br><br>

    <label>Email:</label>
    <input type="email" id="email" required><br><br>

    <label>Senha:</label>
    <input type="password" id="password" required><br><br>

    <button type="submit">Cadastrar</button>
  </form>

  <hr>

  <h2>Lista de Usuários</h2>
  <ul id="users"></ul>

  <script>
    const API_URL = 'http://localhost:1001/api/users';

    //  Função para carregar usuários
    function loadUsers() {
      fetch(API_URL)
        .then(response => response.json())
        .then(data => {
          const list = document.getElementById('users');
          list.innerHTML = ''; // limpa lista antes de renderizar
          data.forEach(user => {
            const li = document.createElement('li');
            li.textContent = `${user.id} - ${user.name} (${user.email})`;
            list.appendChild(li);
          });
        })
        .catch(error => console.error('Erro ao carregar usuários:', error));
    }

    // Função para cadastrar usuário
    document.getElementById('userForm').addEventListener('submit', function(e) {
      e.preventDefault(); // evita reload da página

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      })
      .then(response => response.json())
      .then(data => {
        alert(data.message || 'Usuário cadastrado!');
        loadUsers(); // recarrega lista após cadastro
        document.getElementById('userForm').reset(); // limpa formulário
      })
      .catch(error => console.error('Erro ao cadastrar usuário:', error));
    });

    // Carrega usuários ao abrir a página
    loadUsers();
  </script>
</body>
</html>
