<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="content">
    <header>
      <h1>Cadastro de Clientes</h1>
      <button class="back-btn">Voltar</button>
    </header>

    <form class="form">
      <section>
        <h2>Dados do Cliente</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" name="nome_completo" placeholder="Digite o nome completo " id="name">
          </div>
          <div class="form-group">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="Digite o e-mail" id="email">
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="text" name="telefone" placeholder="(xx) xxxxx-xxxx" id ="phone">
          </div>
          <div class="form-group">
            <label>CPF</label>
            <input type="text" name="cpf" placeholder="000.000.000-00" id="cpf">
          </div>
          <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="date" name="data_nascimento" id="date">
          </div>
        </div>
      </section>

      <section>
        <h2>Endereço</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>CEP</label>
            <input type="text" name="cep" placeholder="Digite o CEP" id="zipCode">
          </div>
          <div class="form-group">
            <label>Endereço</label>
            <input type="text" name="endereco" placeholder="Rua, Avenida..." id="address">
          </div>
          <div class="form-group">
            <label>Número</label>
            <input type="text" name="numero" placeholder="Número" id="houseNumber">
          </div>
          <div class="form-group">
            <label>Complemento</label>
            <input type="text" name="complemento" placeholder="Apartamento, bloco..." id="unit">
          </div>
          <div class="form-group">
            <label>Bairro</label>
            <input type="text" name="bairro" placeholder="Digite o bairro" id="neighborhood">
          </div>
          <div class="form-group">
            <label>Cidade</label>
            <input type="text" name="cidade" placeholder="Digite a cidade" id="city">
          </div>
        </div>
      </section>

      <div class="buttons">
        <button type="reset" class="cancel">Cancelar</button>
        <button type="submit" class="save">Salvar</button>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
